<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מעבדה וירטואלית לכימיה 5 יח״ל: מבחנה שמנערים בטלפון, מדחום, גרפים ו-50 ניסויים לפי מיקוד תשפ״ז.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>המבחנה המנערת</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* פריסה: מחברת מעבדה על נייר מילימטרי. מימין עמדת המבחנה בתוך מסגרת, משמאל דפי המחברת. בטלפון אחד מתחת לשני. */
:root{
  --paper:#eaf0ea; --grid:#cfdccf; --grid2:#b4c7b4; --surface:#fbfcf8; --surface2:#f0f4ee; --ink:#141c22; --muted:#546069; --line:#141c22; --rule:#b9c4bb;
  --accent:#4b2e83; --accent-soft:#e9e2f5; --accent-ink:#ffffff; --hazard:#f7c600; --hazard-ink:#111111;
  --hot:#c43d12; --cold:#1d6fb8; --ok:#1d6b3f; --ok-soft:#dff0e3; --bad:#a9281f; --bad-soft:#f6e0dc;
  --off:#7a4e00; --off-soft:#f8ecc8; --alt:#4b2e83; --alt-soft:#e9e2f5;
  --water:rgba(150,195,235,.38); --glass:rgba(90,110,130,.6); --glass-hi:rgba(255,255,255,.8);
  --display:"Frank Ruhl Libre","Frank Ruhl",Georgia,"Times New Roman",serif;
  --body:"Assistant","Arial Hebrew",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --shadow:4px 4px 0 rgba(20,28,34,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101816; --grid:#1b2624; --grid2:#243331; --surface:#18221f; --surface2:#1f2b28; --ink:#e9eee6; --muted:#9aa8a2; --line:#e9eee6; --rule:#33413d;
  --accent:#c9b1f0; --accent-soft:#2b2340; --accent-ink:#141c22; --hazard:#f7c600; --hazard-ink:#111111;
  --hot:#ff8a5c; --cold:#6cb8ff; --ok:#6fd49a; --ok-soft:#18311f; --bad:#ff8f84; --bad-soft:#3b1d1a;
  --off:#f0c25a; --off-soft:#352b10; --alt:#c9b1f0; --alt-soft:#2b2340;
  --water:rgba(110,165,220,.30); --glass:rgba(175,195,215,.6); --glass-hi:rgba(255,255,255,.25); --shadow:4px 4px 0 rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101816; --grid:#1b2624; --grid2:#243331; --surface:#18221f; --surface2:#1f2b28; --ink:#e9eee6; --muted:#9aa8a2; --line:#e9eee6; --rule:#33413d;
  --accent:#c9b1f0; --accent-soft:#2b2340; --accent-ink:#141c22; --hazard:#f7c600; --hazard-ink:#111111;
  --hot:#ff8a5c; --cold:#6cb8ff; --ok:#6fd49a; --ok-soft:#18311f; --bad:#ff8f84; --bad-soft:#3b1d1a;
  --off:#f0c25a; --off-soft:#352b10; --alt:#c9b1f0; --alt-soft:#2b2340;
  --water:rgba(110,165,220,.30); --glass:rgba(175,195,215,.6); --glass-hi:rgba(255,255,255,.25); --shadow:4px 4px 0 rgba(0,0,0,.45); color-scheme:dark}
body{background:var(--paper);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-position:-1px -1px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
#app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 56px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:900} h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0}
.f{font-family:var(--mono);font-size:.92em;white-space:nowrap;unicode-bidi:isolate}
.lt{unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.muted{color:var(--muted)}
/* כותרת: פס עליון כמו כותרת מחברת */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:10px 12px;border-bottom:3px double var(--line);margin-bottom:26px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:start}
.brand svg{flex:none}
.brand .t{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1.05}
.brand .s{font-size:.86rem;color:var(--muted);font-family:var(--mono)}
.meta{font-size:.84rem;color:var(--muted);font-family:var(--mono)}
/* תוויות: מדבקות מלבניות על מבחנה */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:2px 8px;letter-spacing:.06em;white-space:nowrap;border:1.5px solid currentColor;font-family:var(--mono);text-transform:uppercase}
.tag.base{color:var(--ink);background:var(--surface)}
.tag.alt30{color:var(--alt);background:var(--alt-soft)}
.tag.elective{color:var(--cold);background:var(--surface)}
.tag.off{color:var(--off);background:var(--off-soft);border-style:dashed}
.tags{display:flex;gap:6px;flex-wrap:wrap}
/* דף הבית */
.hero{display:grid;gap:18px;margin-bottom:26px;padding-bottom:22px;border-bottom:1.5px solid var(--line)}
.hero p.lede{font-size:1.12rem;max-width:62ch;color:var(--ink)}
.hero .how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.how .row{display:grid;gap:4px;padding:12px 14px;border-inline-start:1.5px solid var(--line);min-width:0}
.how .row:first-child{border-inline-start:0}
.how .n{font-family:var(--display);font-weight:900;font-size:1.7rem;color:var(--accent);line-height:1}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.unit{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);padding:0 0 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.unit .tags{padding:10px 14px 0}
.unit h2{padding:0 14px}
.unit .sub{color:var(--muted);font-size:.95rem;padding:0 14px 6px;border-bottom:1px solid var(--rule)}
.explist{display:flex;flex-direction:column}
.expbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 14px;font-weight:600;font-size:1rem}
.expbtn:last-child{border-bottom:0}
.expbtn:hover{background:var(--accent-soft)}
.expbtn .go{color:var(--accent);font-family:var(--mono);font-weight:600}
.legend-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:.88rem;color:var(--muted)}
/* מסך ניסוי */
.crumbs{margin-bottom:8px}
.back{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;font-family:var(--mono);font-size:.9rem}
.exphead{display:grid;gap:8px;margin-bottom:14px}
.exphead .lede{max-width:72ch;color:var(--ink);font-size:1.05rem}
details.curr{background:var(--surface);border:1px solid var(--rule);border-inline-start:4px solid var(--accent);padding:8px 14px;max-width:80ch}
details.curr summary{cursor:pointer;font-weight:700;font-size:.92rem}
details.curr ul{margin:8px 0 4px;padding-inline-start:20px;font-size:.93rem}
.offnote{background:var(--off-soft);color:var(--ink);border:1.5px dashed var(--off);padding:8px 14px;font-size:.93rem;max-width:80ch}
.offnote b{color:var(--off)}
.steps{display:flex;gap:0;list-style:none;padding:0;margin:4px 0 16px;flex-wrap:wrap;border:1.5px solid var(--line);width:max-content;max-width:100%;background:var(--surface)}
.steps li{font-size:.84rem;padding:5px 14px;border-inline-start:1.5px solid var(--line);color:var(--muted);font-family:var(--mono)}
.steps li:first-child{border-inline-start:0}
.steps li.on{background:var(--ink);color:var(--paper);font-weight:700}
.steps li.done{color:var(--ok);text-decoration:line-through}
.bench{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);padding:14px}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stage::before{content:"עמדת הניסוי";position:absolute;top:0;right:0;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:2px 10px}
.stage canvas#tube{width:min(100%,300px,calc(46vh*.7));aspect-ratio:280/400;align-self:center;display:block;touch-action:manipulation;margin-top:14px}
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:0;border:1px solid var(--rule)}
.ro{padding:6px 8px;min-width:0;border:1px solid var(--rule);margin:-1px 0 0 -1px;background:var(--surface2)}
.ro .l{font-size:.72rem;color:var(--muted);line-height:1.2}
.ro .v{font-family:var(--mono);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;white-space:nowrap}
.shakezone{display:flex;flex-direction:column;gap:8px}
.prompt{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--ink);border-inline-start:4px solid var(--accent);padding:9px 12px;font-weight:700}
.prompt svg{flex:none;color:var(--accent)}
.prompt.idle{background:var(--surface2);color:var(--muted);font-weight:500;border-inline-start-color:var(--rule)}
/* כפתור הניעור: מקש בטיחות צהוב-שחור */
.shakebtn{width:100%;border:3px solid var(--hazard-ink);background:var(--hazard);color:var(--hazard-ink);padding:16px 12px;font-weight:800;font-size:1.15rem;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;box-shadow:0 5px 0 var(--hazard-ink);letter-spacing:.01em}
.shakebtn::before{content:"";position:absolute;inset:-3px -3px auto -3px;height:8px;background:repeating-linear-gradient(-45deg,var(--hazard-ink) 0 10px,var(--hazard) 10px 20px)}
.shakebtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--hazard-ink)}
.shakebtn.small{padding:8px 10px;font-size:.88rem;font-weight:700;background:var(--surface2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.shakebtn.small::before{display:none}
.shakebtn.small:active{transform:none}
.meter{height:8px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 8px);transition:width .15s}
.hint{font-size:.84rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:700;font-size:.95rem;box-shadow:2px 2px 0 var(--line)}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:2px 2px 0 var(--line)}
.btn.ghost{background:none;box-shadow:none}
.notebook{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{display:flex;flex-direction:column;gap:14px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-origin:content-box;background-attachment:local}
.panel h2{background:var(--surface);display:inline-block}
.ctl{display:grid;gap:6px;background:var(--surface)}
.ctl label,.ctl .lab{font-weight:700;font-size:.92rem}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1.5px solid var(--line);width:max-content;max-width:100%}
.seg button{border:0;border-inline-start:1.5px solid var(--line);background:var(--surface);padding:7px 13px;font-size:.95rem}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.rangewrap{display:flex;align-items:center;gap:12px}
.rangewrap input{flex:1;accent-color:var(--accent);min-width:0}
.rangewrap output{font-family:var(--mono);font-weight:600;min-width:5.5em;text-align:left;direction:ltr}
.graphcard canvas{width:100%;height:210px;display:block}
.graphhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;display:inline-block}
.q{border:1px solid var(--rule);border-inline-start:4px solid var(--line);padding:12px 14px;background:var(--surface);display:grid;gap:10px}
.q .qn{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.q .qt{font-weight:700}
.opts{display:grid;gap:6px}
.opt{text-align:start;border:1.5px solid var(--rule);background:var(--surface);padding:9px 12px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--line)}
.opt.sel-ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.sel-bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.numrow input{font-family:var(--mono);font-size:1rem;padding:8px 10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:10em;direction:ltr;text-align:left}
.numrow select{font-family:var(--mono);font-size:.95rem;padding:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);direction:ltr}
.fb{padding:9px 12px;font-size:.94rem;border-inline-start:4px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb b.h{display:block;margin-bottom:2px}
.fb.ok b.h{color:var(--ok)} .fb.bad b.h{color:var(--bad)}
.datatbl{width:100%;border-collapse:collapse;font-size:.93rem;background:var(--surface)}
.datatbl td{padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.datatbl tr:first-child td{border-top:1.5px solid var(--line)}
.datatbl td:last-child{font-family:var(--mono);direction:ltr;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.compare{padding:10px 12px;background:var(--accent-soft);border-inline-start:4px solid var(--accent);font-size:.94rem}
.score{font-family:var(--display);font-size:1.2rem;font-weight:700;background:var(--surface)}
.indleg{display:flex;height:16px;overflow:hidden;direction:ltr;border:1px solid var(--line)}
.indleg i{flex:1}
.indnums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);direction:ltr}
.safety{font-size:.84rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.foot{margin-top:34px;font-size:.82rem;color:var(--muted);border-top:3px double var(--line);padding-top:12px;max-width:90ch}
@media (max-width:820px){
  .hero .how{grid-template-columns:1fr 1fr}
  .how .row:nth-child(3){border-inline-start:0}
  .how .row:nth-child(n+3){border-top:1.5px solid var(--line)}
  .bench{grid-template-columns:1fr}
  .stage{position:relative;top:auto}
  .stage canvas#tube{max-width:260px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="חזרה לדף הבית">
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><rect x="9" y="2" width="16" height="4" rx="1.5" fill="currentColor" opacity=".55"/><path d="M11 6v26a6 6 0 0 0 12 0V6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11.8 22h10.4v10a5.2 5.2 0 0 1-10.4 0z" fill="currentColor" opacity=".5"/><path d="M4 14l-3 2M30 14l3 2M4 26l-3-1M30 26l3-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".6"/></svg>
      <span><span class="t">המבחנה המנערת</span><br><span class="s">תרגול כימיה חווייתי באמצעות מעבדה מקוונת</span></span>
    </button>
    <span class="meta">פותח ע"י נוי נוביק</span>
  </header>
  <main id="view"></main>
  <p class="foot">הסימולציה מחשבת טמפרטורה, נפחי גז ו-pH מערכים כימיים מהספרות (אנתלפיות המסה ותגובה, מסיסויות, משוואת הגזים). זו מעבדה וירטואלית ואינה מחליפה ניסוי אמיתי. במעבדה אמיתית לא מנערים מבחנה כשהאגודל על הפתח: מערבבים בתנועת פרק כף היד או במקל זכוכית.</p>
</div>

<script>
"use strict";
/* ============ כלים כלליים ============ */
const $=s=>document.querySelector(s);
const F=s=>`<bdi class="f" dir="ltr">${s}</bdi>`;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const CW=4.18, RL=0.082, RJ=8.314;
const SUPD={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sup=n=>String(n).split("").map(c=>SUPD[c]||c).join("");
function fmt(x,d=3){ if(x==null||!isFinite(x))return "—"; const a=Math.abs(x);
  if(a!==0&&(a<0.01||a>=1e5)){const e=Math.floor(Math.log10(a)); const m=x/10**e; return (+m.toFixed(2))+"·10"+sup(e);}
  return String(+x.toPrecision(d)); }
const fx=(x,n=1)=>(+x).toFixed(n);
function interpT(arr,T){const Ts=[0,20,40,60,80];T=clamp(T,0,80);for(let i=0;i<4;i++){if(T<=Ts[i+1]){return lerp(arr[i],arr[i+1],(T-Ts[i])/20)}}return arr[4]}
function rgba(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a==null?(c[3]??1):a})`}
function mixC(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t),lerp(c1[3]??1,c2[3]??1,t)]}
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const gauss=(()=>{const r=rnd(777);return()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}})();
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"}
function parseNum(s){ if(s==null)return NaN; s=String(s).trim().replace(/,/g,".").replace(/−/g,"-").replace(/\s+/g,"");
  const m=s.match(/^([-+]?\d*\.?\d+)(?:(?:[x×*·]10\^?|e|E)([-+]?\d+))?$/); if(!m)return NaN; return parseFloat(m[1])*(m[2]?10**parseInt(m[2]):1); }


/* תיקון כיווניות: עוטף רצפים לטיניים (מספרים, יחידות, נוסחאות) בתגית LTR כדי שלא יתהפכו בתוך טקסט עברי */
function bidiFix(html){ const parts=String(html).split(/(<[^>]+>)/); let skip=0;
  return parts.map(part=>{ if(part.startsWith("<")){ const t=part.match(/^<\/?\s*([a-z]+)/i); const n=t?t[1].toLowerCase():"";

  prompt(){ if(this.Vun>0) return "נער כדי לערבב את ה-"+this.tName()+" שהוספת"; return null; }

  layers(){ const unC=this.base?[...indColor(.5).slice(0,3),.75]:[...indColor(13.5).slice(0,3),.75]; return [{v:this.Va+this.Vmix,c:indColor(this.pH())},{v:this.Vun,c:unC}]; }
  solids(){return null}
  actions(){ return [{id:"a1",label:"הוסף 1 mL "+this.tName(),dis:this.Vtot>=this.maxV||this.Vun>0},{id:"a5",label:"הוסף 5 mL",dis:this.Vtot>this.maxV-5||this.Vun>0}] }
  act(id){ if(id==="a1")this.add(1); if(id==="a5")this.add(5); }
  graph(){return {xl:"נפח "+this.tName()+" שהוסף (mL)",yl:"pH",series:[{name:"pH",color:"accent",pts:this.hist,dots:true}],ymin:0,ymax:14,xmin:0,xmax:this.maxV}}
  readouts(){return [["pH",this.Vun>0?"מעורבב חלקית":fx(this.pH(),2)],[this.tName()+" שהוסף",fx(this.Vtot,0)+" mL"],["טמפרטורה",fx(this.T)+" °C"],["ΔT",(this.T-this.T0>=0?"+":"")+fx(this.T-this.T0)+" °C"]];}
  done(){return this.Vtot>=12&&this.Vun===0}
  eqV(){ const h=this.hist; for(let i=1;i<h.length;i++){ const a=h[i-1],b=h[i]; if((a.y-7)*(b.y-7)<=0&&a.y!==b.y) return a.x+(7-a.y)/(b.y-a.y)*(b.x-a.x); } return 10*this.cAn; }
  record(){ const an=this.base?F("NaOH(aq)")+" ריכוז לא ידוע":(this.weak?F("CH₃COOH(aq)")+" 1 M":F("HCl(aq)")+" 1 M");
    const rows=[[this.base?"בסיס":"חומצה",an],["נפח",this.Va+" mL"],["ריכוז ה-"+this.tName(),"1 M"],["סך "+this.tName()+" שהוסף",this.Vtot+" mL"],["טמפרטורה התחלתית",fx(this.T0)+" °C"],["טמפרטורה מקסימלית",fx(this.Tmax)+" °C"]];
    return {kind:"neut",weak:this.weak,base:this.base,cAn:this.cAn,eqV:this.eqV(),hist:this.hist.slice(),Vtot:this.Vtot,T0:this.T0,Tmax:this.Tmax,rows}; }
}

    net:"Ag⁺(aq) + Cl⁻(aq) → AgCl(s)",spect:"Na⁺(aq), NO₃⁻(aq)",wrong:["AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)","Na⁺(aq) + NO₃⁻(aq) → NaNO₃(s)","Ag⁺(aq) + Cl⁻(aq) → AgCl(aq)"],

    net:"Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s)",spect:"K⁺(aq), NO₃⁻(aq)",wrong:["Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)","K⁺(aq) + NO₃⁻(aq) → KNO₃(s)","Pb²⁺(aq) + I⁻(aq) → PbI(s)"],

    net:"Cu²⁺(aq) + 2OH⁻(aq) → Cu(OH)₂(s)",spect:"Na⁺(aq), SO₄²⁻(aq)",wrong:["CuSO₄(aq) + 2NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq)","2Na⁺(aq) + SO₄²⁻(aq) → Na₂SO₄(s)","Cu²⁺(aq) + OH⁻(aq) → CuOH(s)"],
    wrongSp:["Cu²⁺(aq), OH⁻(aq)","Na⁺(aq), OH⁻(aq)","אין יונים צופים"],nP:.00025,lim:"יוני OH⁻ (נדרשים שניים לכל Cu²⁺)"},
  BaSO4:{A:{f:"BaCl₂(aq)",c:[150,195,235,.30]},B:{f:"Na₂SO₄(aq)",c:[150,195,235,.30]},prod:{f:"BaSO₄(s)",name:"באריום גופרתי",c:[246,246,246]},
    net:"Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)",spect:"Na⁺(aq), Cl⁻(aq)",wrong:["BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq)","Na⁺(aq) + Cl⁻(aq) → NaCl(s)","Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(aq)"],
    wrongSp:["Ba²⁺(aq), SO₄²⁻(aq)","Ba²⁺(aq), Cl⁻(aq)","אין יונים צופים"],nP:.0005,lim:"שניהם מגיבים בדיוק (יחס 1:1)"},
  none:{A:{f:"NaCl(aq)",c:[150,195,235,.30]},B:{f:"KNO₃(aq)",c:[150,195,235,.30]},prod:null}
};
class PrecipSim{
  constructor(p){this.p=p; this.pr=PAIRS[p.pair]; this.m=0; this.t=0; this.stir=0; this.settle=0; this.T=p.Troom; this.shakes=0;}
  shake(I){this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); this.m=Math.min(1,this.m+(1-this.m)*.13*I);}
  step(dt){this.t+=dt; this.m=Math.min(1,this.m+.0015*dt); this.stir*=Math.exp(-1.5*dt); this.settle=this.stir>.15?Math.max(0,this.settle-dt):Math.min(1,this.settle+.06*dt);}
  amt(){return this.pr.prod?this.m:0}
  layers(){ const A=this.pr.A.c,B=this.pr.B.c; let mid=mixC(A,B,.5);
    if(this.p.pair==="CuOH") mid=[...mixC([60,130,225],[150,195,235],.5+.25*this.m).slice(0,3),.5-.12*this.m];
    return [{v:5*(1-this.m),c:A},{v:10*this.m,c:mid},{v:5*(1-this.m),c:B}]; }
  precip(){return this.pr.prod?{amt:this.amt(),c:this.pr.prod.c,settle:this.settle}:null}
  solids(){return null}
  prompt(){return this.m<.97?"נער כדי לערבב את שתי התמיסות":(this.settle<.5?"הפסק לנער וצפה בתחתית המבחנה":null)}
  idle(){return this.pr.prod?"המשקע שוקע לתחתית.":"שתי התמיסות מעורבבות."}
  graph(){return null}
  readouts(){return [["ערבוב",fx(this.m*100,0)+"%"],["משקע",this.pr.prod?(this.m>.05?"נוצר":"עדיין לא"):"לא נוצר"]]}
  done(){return this.m>.95}
  record(){ const pr=this.pr; const rows=[["תמיסה א",F(pr.A.f)+" 0.1 M, 5 mL"],["תמיסה ב",F(pr.B.f)+" 0.1 M, 5 mL"],["תוצאה",pr.prod?"נוצר משקע "+pr.prod.name+" "+F(pr.prod.f):"לא נוצר משקע"]];
    return {kind:"precip",pair:this.p.pair,pr,rows}; }
}

/* ============ שיווי משקל של קובלט ============ */
class EquilSim{
  constructor(p){ this.T=25; this.Tbath=25; this.Cl=5; this.cat=false; this.t=0; this.stir=0; this.x=this.xeq(); this.hist=[{x:0,y:this.T}]; this.xh=[{x:0,y:this.x*100}]; this._h=0; this.log=[]; }
  xeq(){ const K=(1/1296)*Math.exp(6014*(1/298-1/(this.T+273))); const q=K*this.Cl**4; return q/(1+q); }
  shake(I){this.stir=Math.min(1,this.stir+.3*I)}
  step(dt){ this.t+=dt; const kT=.035*(1+1.5*this.stir); this.T+=(this.Tbath-this.T)*(1-Math.exp(-kT*dt));
    const kx=.12*(1+2*this.stir)*(this.cat?2.5:1); this.x+=(this.xeq()-this.x)*(1-Math.exp(-kx*dt)); this.stir*=Math.exp(-1.5*dt);
    this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:this.T}); this.xh.push({x:this.t,y:this.x*100}); if(this.hist.length>1500){this.hist.splice(1,1);this.xh.splice(1,1);}} }
  color(){return mixC([226,120,170,.8],[35,70,200,.85],this.x)}
  layers(){return [{v:12,c:this.color()}]}
  solids(){return null}
  get bath(){return this.Tbath}
  actions(){return [{id:"hot",label:"אמבט חם 70°C",on:this.Tbath===70},{id:"room",label:"אמבט 25°C",on:this.Tbath===25},{id:"ice",label:"אמבט קרח 0°C",on:this.Tbath===0},
    {id:"cl",label:"הוסף HCl מרוכז",dis:this.Cl>8.5},{id:"w",label:"הוסף מים"},{id:"cat",label:this.cat?"זרז נוסף":"הוסף זרז",dis:this.cat}]}
  act(id){ const before=this.colorName();
    if(id==="hot")this.Tbath=70; if(id==="room")this.Tbath=25; if(id==="ice")this.Tbath=0;
    if(id==="cl"){this.Cl=Math.min(9,this.Cl+1); this.log.push("cl");} if(id==="w"){this.Cl*=.8; this.log.push("w");} if(id==="cat"){this.cat=true; this.log.push(Math.abs(this.x-this.xeq())<.02?"catEq":"cat");}
    if(["hot","room","ice"].includes(id)) this.log.push(id); }
  colorName(){return this.x>.62?"כחול":this.x<.3?"ורוד":"סגול"}
  prompt(){return Math.abs(this.T-this.Tbath)>3?"נער כדי שהתמיסה תגיע מהר לטמפרטורת האמבט":null}
  idle(){return "בחר אמבט או הוסף חומר, וצפה בצבע"}
  graph(){return {xl:"זמן (s)",yl:"% קומפלקס כחול / טמפרטורה",series:[{name:"% [CoCl₄]²⁻ (כחול)",color:"accent",pts:this.xh},{name:"טמפרטורה (°C)",color:"hot",pts:this.hist}],ymin:0,ymax:100}}
  readouts(){return [["טמפרטורה",fx(this.T)+" °C"],["צבע",this.colorName()],["[Cl⁻]",fx(this.Cl,1)+" M"],["זמן",fx(this.t,0)+" s"]]}
  done(){return this.log.length>=2}
  record(){return {kind:"equil",log:this.log.slice(),rows:[["פעולות שביצעת",this.log.length+""],["צבע בסוף",this.colorName()],["טמפרטורה בסוף",fx(this.T)+" °C"]]}}
}

/* ============ ספקטרופוטומטריה ============ */
class SpectroSim{
  constructor(p){ this.eps=12.0; this.std=[]; this.unk=+(0.035+((Date.now()%1000)/1000)*.035).toFixed(4); this.unkA=[]; this.mode="std"; this.mass=.10; this.T=24;
    this.ds=new DissolveSim({sub:"CuSO4",mass:this.mass,water:10,Tw:24,Troom:24,size:"powder"}); this.t=0; }
  get cur(){return this.ds}
  shake(I){ if(this.mode==="std") this.ds.shake(I); }
  step(dt){this.t+=dt; if(this.mode==="std")this.ds.step(dt);}
  dissolved(){return this.ds.solid<.002}
  layers(){ if(this.mode==="unk"){return [{v:10,c:mixC([150,195,235,.35],[30,95,210,.85],clamp(this.unk/.12,0,1))}]} return this.ds.layers(); }
  solids(){return this.mode==="std"?this.ds.solids():null}
  actions(){ const used=this.std.map(s=>s.m);
    const a=[.05,.10,.15,.20,.25].map(m=>({id:"std_"+m,label:"הכן "+fx(m,2)+" g",on:this.mode==="std"&&Math.abs(this.mass-m)<1e-6,dis:used.some(u=>Math.abs(u-m)<1e-6)}));
    a.push({id:"meas",label:"מדוד בליעה",dis:this.mode==="std"?(!this.dissolved()||used.some(u=>Math.abs(u-this.mass)<1e-6)):this.unkA.length>=3,primary:true});
    a.push({id:"unk",label:"טען דגימה לא ידועה",on:this.mode==="unk",dis:this.std.length<3}); return a; }
  act(id){ if(id.startsWith("std_")){this.mode="std"; this.mass=+id.slice(4); this.ds=new DissolveSim({sub:"CuSO4",mass:this.mass,water:10,Tw:24,Troom:24,size:"powder"});}
    if(id==="unk")this.mode="unk";
    if(id==="meas"){ if(this.mode==="std"){const c=this.mass/249.7/.010; this.std.push({m:this.mass,c,A:+(this.eps*c+gauss()*.006).toFixed(3)}); this.std.sort((a,b)=>a.c-b.c);}
      else this.unkA.push(+(this.eps*this.unk+gauss()*.008).toFixed(3)); } }
  fit(){ const n=this.std.length; if(n<2)return null; let sx=0,sy=0,sxx=0,sxy=0; for(const s of this.std){sx+=s.c;sy+=s.A;sxx+=s.c*s.c;sxy+=s.c*s.A}
    const m=(n*sxy-sx*sy)/(n*sxx-sx*sx), b=(sy-m*sx)/n; return {m,b}; }
  prompt(){ if(this.mode==="std"&&!this.dissolved()) return "נער כדי להמיס את הגבישים הכחולים"; return null; }
  idle(){ if(this.std.length<3) return "הכן לפחות שלוש תמיסות תקן: בחר מסה, נער עד שהכול נמס, ומדוד"; if(this.unkA.length<3) return "טען את הדגימה הלא ידועה ומדוד אותה שלוש פעמים"; return "יש לך מספיק נתונים. אפשר לעבור לשאלות."; }
  graph(){ const f=this.fit(); const s=[{name:"תמיסות תקן",color:"accent",pts:this.std.map(s=>({x:s.c,y:s.A})),dots:true,noline:true}];
    if(f) s.push({name:"קו כיול",color:"muted",pts:[{x:0,y:f.b},{x:.11,y:f.b+f.m*.11}],dash:true});
    if(this.unkA.length){const mA=this.unkA.reduce((a,b)=>a+b,0)/this.unkA.length; s.push({name:"דגימה (ממוצע)",color:"hot",pts:[{x:0,y:mA},{x:.11,y:mA}],dash:true});}
    return {xl:"ריכוז Cu²⁺ (M)",yl:"בליעה A",series:s,xmin:0,xmax:.11,ymin:0,ymax:1.4}; }
  readouts(){ const r=[["תקנים שנמדדו",this.std.length+""],["מדידות דגימה",this.unkA.length+""]];
    if(this.mode==="std") r.push(["ריכוז בתקן",this.dissolved()?fmt(this.mass/249.7/.01)+" M":"עדיין נמס"]); if(this.std.length) r.push(["בליעה אחרונה",String(this.std[this.std.length-1].A)]); return r; }
  done(){return this.std.length>=3&&this.unkA.length>=3}
  record(){ const f=this.fit(); const mA=this.unkA.reduce((a,b)=>a+b,0)/Math.max(1,this.unkA.length);
    const sd=this.unkA.length>1?Math.sqrt(this.unkA.reduce((a,b)=>a+(b-mA)**2,0)/(this.unkA.length-1)):0;
    const rows=this.std.map((s,i)=>["תקן "+(i+1)+": "+fx(s.m,2)+" g ב-10 mL",fmt(s.c,3)+" M → A = "+s.A]).concat(this.unkA.map((a,i)=>["דגימה, מדידה "+(i+1),"A = "+a]));
    if(f) rows.push(["משוואת קו הכיול","A = "+fx(f.m,2)+"·c "+(f.b>=0?"+ ":"− ")+fx(Math.abs(f.b),3)]);
    return {kind:"spectro",fit:f,mA,sd,unkA:this.unkA.slice(),std:this.std.slice(),rows}; }
}

/* ============ פעילות יחסית של מתכות ============ */
const METALS={Mg:{n:"מגנזיום",f:"Mg",M:24.3,act:3,c:[175,182,190]},Zn:{n:"אבץ",f:"Zn",M:65.4,act:2,c:[150,158,168]},Cu:{n:"נחושת",f:"Cu",M:63.5,act:1,c:[184,101,58]}};
const IONS={Cu:{f:"CuSO₄",ion:"Cu²⁺",act:1,dHf:64.8},Zn:{f:"ZnSO₄",ion:"Zn²⁺",act:2,dHf:-153.9},Mg:{f:"MgSO₄",ion:"Mg²⁺",act:3,dHf:-466.9}};
class DisplaceSim{
  constructor(p){ this.p=p; this.mt=METALS[p.metal]; this.io=IONS[p.ion]; this.react=this.mt.act>this.io.act; this.nM0=.2/this.mt.M; this.nM=this.nM0; this.nI0=.005; this.nI=this.nI0;
    this.dH=this.react?(IONS[p.metal].dHf-this.io.dHf):0; this.T=p.Troom; this.T0=this.T; this.Troom=p.Troom; this.Tmax=this.T; this.t=0; this.stir=0; this.hist=[{x:0,y:this.T}]; this._h=0; this.r=0; }
  shake(I){this.stir=Math.min(1,this.stir+.3*I)}
  step(dt){ this.t+=dt; let dn=0; if(this.react&&this.nM>0&&this.nI>0){ dn=1.6e-4*Math.pow(this.nM/this.nM0,2/3)*(this.nI/.010)*(1+2.5*this.stir)*dt; dn=Math.min(dn,this.nM,this.nI);
      if(this.nM-dn<.004*this.nM0||this.nI-dn<.004*this.nI0) dn=Math.min(this.nM,this.nI); }
    this.nM-=dn; this.nI-=dn; this.r=dn/dt; this.T+=(-this.dH*1000*dn)/(10*CW); this.T+=-.006*(this.T-this.Troom)*dt; this.Tmax=Math.max(this.Tmax,this.T); this.stir*=Math.exp(-1.5*dt);
    this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:this.T});} }
  layers(){ let c=[150,195,235,.35]; if(this.p.ion==="Cu") c=mixC([150,195,235,.32],[30,100,215,.8],this.nI/this.nI0); return [{v:10,c}] }
  solids(){ return {frac:this.nM/this.nM0,kind:"powder",col:this.mt.c,n:50} }
  deposit(){ return this.react?{frac:(this.nI0-this.nI)/this.nI0,c:METALS[this.p.ion].c}:null }
  prompt(){ if(!this.react) return this.t>20?"גם אחרי ניעור לא קורה דבר. מה ההסבר?":"נער כדי לערבב את המתכת בתמיסה"; if(this.r<1e-7&&this.t>3) return null; return "נער כדי לזרז את התגובה"; }
  graph(){return {xl:"זמן (s)",yl:"טמפרטורה (°C)",series:[{name:"טמפרטורה",color:"hot",pts:this.hist}]}}
  readouts(){return [["טמפרטורה",fx(this.T)+" °C"],["ΔT",(this.T-this.T0>=0?"+":"")+fx(this.T-this.T0)+" °C"],["זמן",fx(this.t,0)+" s"]]}
  done(){return this.t>15}
  record(){return {kind:"displace",p:this.p,react:this.react,mt:this.mt,io:this.io,dT:this.Tmax-this.T0,rows:[["מתכת",this.mt.n+" "+F(this.mt.f+"(s)")+", 0.20 g"],["תמיסה",F(this.io.f+"(aq)")+" 0.5 M, 10 mL"],["ΔT",fx(this.Tmax-this.T0)+" °C"],["תצפית",this.react?"נוצר מוצק חדש על המתכת":"לא נראה שינוי"]]}}
}

/* ============ קורוזיה ============ */
const RUST={dry:{n:"אוויר יבש (עם חומר מייבש)",base:0,col:[0,0,0,0],water:false},boiled:{n:"מים רתוחים מתחת לשכבת שמן",base:.006,col:[150,195,235,.30],water:true,oil:true},
  tap:{n:"מי ברז",base:.06,col:[150,195,235,.32],water:true},salt:{n:"מי מלח",base:.16,col:[150,195,235,.34],water:true}};
class RustSim{
  constructor(p){this.c=p.cond; this.d=RUST[p.cond]; this.day=0; this.rust=0; this.o2=this.d.oil?.15:.6; this.t=0; this.stir=0; this.hist=[{x:0,y:0}]; this.shakes=0;}
  shake(I){ this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); if(this.d.water&&!this.d.oil) this.o2=Math.min(1,this.o2+.04*I); }
  step(dt){this.t+=dt; this.stir*=Math.exp(-1.5*dt)}
  advance(days){ for(let i=0;i<days;i++){ const r=this.d.base*this.o2*(1-this.rust); this.rust=Math.min(1,this.rust+r); this.o2=Math.max(0,this.o2-r*.8);
      if(this.d.water&&!this.d.oil) this.o2+=(.6-this.o2)*.35; this.day++; this.hist.push({x:this.day,y:+(this.rust*100).toFixed(1)}); } }

  act(id){ if(id==="d1")this.advance(1); if(id==="d5")this.advance(5); }

const OILS={sun:{n:"שמן חמניות",cap:1.3},olive:{n:"שמן זית",cap:.72},coco:{n:"שמן קוקוס (מומס)",cap:.08}};
class BromineSim{
  constructor(p){this.o=OILS[p.oil]; this.br=1; this.cap=this.o.cap; this.m=0; this.t=0; this.stir=0; this.shakes=0;}
  shake(I){this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); this.m=Math.min(1,this.m+(1-this.m)*.15*I);}
  step(dt){ this.t+=dt; const d=Math.min(this.br,this.cap,.12*this.m*dt); this.br-=d; this.cap-=d; this.m*=Math.exp(-.12*dt); this.stir*=Math.exp(-1.5*dt); }
  brc(){return mixC([150,195,235,.3],[205,105,30,.85],this.br)}
  layers(){ const oil=[232,200,90,.7]; return [{v:6*(1-this.m*.6),c:this.brc()},{v:8*this.m*.6,c:mixC(this.brc(),oil,.4),emul:this.m},{v:2.4*(1-this.m*.6),c:oil}]; }
  solids(){return null}
  prompt(){return this.shakes<30?"נער כדי לערבב את השמן עם מי הברום":"הפסק לנער וצפה בצבע השכבה התחתונה"}
  graph(){return null}
  readouts(){return [["צבע ברום שנותר",fx(this.br*100,0)+"%"],["ערבוב",fx(this.m*100,0)+"%"]]}
  done(){return this.shakes>20}
  record(){return {kind:"bromine",oil:this.o,br:this.br,rows:[["שמן",this.o.n],["צבע מי הברום שנותר",fx(this.br*100,0)+"%"]]}}
}

/* ============ גרסה 2: מנועי סימולציה נוספים ============ */
/* דילול: המסה ואחר כך הוספת מים במנות של 10 mL */
class DilutionSim extends DissolveSim{
  constructor(p){super(p); this.adds=0;}
  actions(){return [{id:"w10",label:"הוסף 10 mL מים",dis:this.Vw>=30||this.solid>.01}]}
  act(id){ if(id==="w10"&&this.Vw<30){ const Tn=(this.T*(this.Vw+this.diss)+this.Troom*10)/(this.Vw+this.diss+10); this.Vw+=10; this.T=Tn; this.adds++; } }
  idle(){ return this.Vw>=30?"הגעת ל-30 mL. אפשר לעבור לשאלות.":"כל המוצק נמס. אפשר להוסיף מים ולדלל, או לעבור לשאלות."; }
  record(){ const r=super.record(); r.kind="dilution"; r.adds=this.adds; r.Vfinal=this.Vw; r.rows[2]=["נפח המים בהתחלה",this.p.water+" mL"]; r.rows.push(["נפח סופי של התמיסה",this.Vw+" mL"],["תוספות מים",this.adds+" × 10 mL"]); return r; }
}
/* מוליכות: נורה שנדלקת רק כשיש יונים ממוימים */
class ConductSim extends DissolveSim{
  get lamp(){ if(this.s.type!=="ionic") return 0; return clamp(this.conc()/.3,0,1); }
  readouts(){ const r=super.readouts(); r.push(["נורה",this.lamp>.05?"דולקת":"כבויה"]); return r; }
  record(){ const r=super.record(); r.lamp=this.lamp; r.rows.push(["הנורה",this.lamp>.05?"דולקת":"כבויה"]); return r; }
}
/* שמן ומים עם סבון: תחליב שאינו נפרד */
class SoapSim extends DissolveSim{
  constructor(p){super(p); this.soap=false;}
  actions(){return [{id:"soap",label:"הוסף טיפת סבון",dis:this.soap}]}
  act(id){ if(id==="soap") this.soap=true; }
  step(dt){ const e=this.emul; super.step(dt); if(this.soap) this.emul=e; }
  prompt(){ if(this.emul>.6) return "הפסק לנער וצפה: האם השכבות נפרדות שוב?"; return super.prompt(); }
  idle(){ return this.soap?"עם סבון הטיפות נשארות מפוזרות גם בלי ניעור.":"בלי סבון השמן חוזר לשכבה נפרדת. נסה להוסיף סבון ולנער."; }
  record(){ const r=super.record(); r.soap=this.soap; r.emul=this.emul; r.rows.push(["סבון",this.soap?"נוסף":"לא נוסף"],["מצב בסוף",this.emul>.3?"תחליב (טיפות מפוזרות)":"שתי שכבות נפרדות"]); return r; }
}
/* ערבוב שתי תמיסות עם אנתלפיית תגובה (סתירה, שיקוע) */
class MixReactSim{
  constructor(p){ this.p=p; this.m=0; this.t=0; this.stir=0; this.settle=0; this.Troom=p.Troom; this.T=p.Troom; this.T0=this.T; this.Tmax=this.T; this.Tmin=this.T; this.insul=!!p.insul; this.k=this.insul?.0006:.006; this.hist=[{x:0,y:this.T}]; this._h=0; this.shakes=0; }
  shake(I){ this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); this.react(Math.min(1-this.m,(1-this.m)*.13*I)); }
  react(dm){ if(dm<=0)return; this.m+=dm; this.T+=(-this.p.dH*1000*this.p.n*dm)/((this.p.VA+this.p.VB)*CW); }
  step(dt){ this.t+=dt; this.react(Math.min(1-this.m,.0015*dt)); this.T+=-this.k*(this.T-this.Troom)*dt; this.Tmax=Math.max(this.Tmax,this.T); this.Tmin=Math.min(this.Tmin,this.T); this.stir*=Math.exp(-1.5*dt);
    this.settle=this.stir>.15?Math.max(0,this.settle-dt):Math.min(1,this.settle+.06*dt);
    this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:this.T}); if(this.hist.length>900)this.hist.splice(1,1);} }
  layers(){ const A=this.p.colA,B=this.p.colB; const mid=this.p.colMix||mixC(A,B,.5); return [{v:this.p.VA*(1-this.m),c:A},{v:(this.p.VA+this.p.VB)*this.m,c:mid},{v:this.p.VB*(1-this.m),c:B}]; }
  precip(){ return this.p.precipC?{amt:this.m,c:this.p.precipC,settle:this.settle}:null }
  solids(){return null}
  prompt(){ return this.m<.97?"נער כדי לערבב את שתי התמיסות":null }
  idle(){ return "התמיסות מעורבבות. עקוב אחרי המדחום." }
  graph(){ return {xl:"זמן (s)",yl:"טמפרטורה (°C)",series:[{name:"טמפרטורה",color:"hot",pts:this.hist}]} }
  readouts(){ return [["טמפרטורה",fx(this.T)+" °C"],["ΔT",(this.T-this.T0>=0?"+":"")+fx(this.T-this.T0)+" °C"],["ערבוב",fx(this.m*100,0)+"%"],["זמן",fx(this.t,0)+" s"]] }
  done(){ return this.m>.95 }
  record(){ const dT=this.p.dH<0?this.Tmax-this.T0:this.Tmin-this.T0; const rows=[["תמיסה א",this.p.nameA],["תמיסה ב",this.p.nameB],["טמפרטורה התחלתית",fx(this.T0)+" °C"],[this.p.dH<0?"טמפרטורה מקסימלית":"טמפרטורה מינימלית",fx(this.p.dH<0?this.Tmax:this.Tmin)+" °C"],["ΔT",(dT>=0?"+":"")+fx(dT)+" °C"]];
    return {kind:"mix",p:this.p,dT:+dT.toFixed(1),T0:this.T0,V:this.p.VA+this.p.VB,n:this.p.n,rows}; }
}
/* קרח במים: היתוך, מאזן חום, ובאמבט קר גם קפיאה */
class IceSim{
  constructor(p){ this.p=p; this.mi0=p.mi; this.ice=p.mi; this.water=p.Vw; this.T=p.Tw; this.T0=this.T; this.Tmin=this.T; this.Tbath=p.bath; this.t=0; this.stir=0; this.hist=[{x:0,y:this.T}]; this._h=0; this.insul=p.bath==null; this.shakes=0; }
  get bath(){return this.Tbath}
  shake(I){ this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); }
  step(dt){ this.t+=dt;
    if(this.Tbath!=null) this.T+=(this.Tbath-this.T)*(1-Math.exp(-.02*(1+2*this.stir)*dt));
    if(this.ice>0&&this.T>0){ let dm=Math.min(this.ice,.012*this.T*(1+3*this.stir)*dt); const mw=this.water; if((mw*this.T-334*dm/CW)<0) dm=Math.min(this.ice,mw*this.T*CW/334);
      this.ice-=dm; this.water+=dm; this.T=Math.max(0,(mw*this.T-334*dm/CW)/(mw+dm)); }
    if(this.T<0&&this.water>.1&&this.Tbath!=null){ const df=Math.min(this.water,.004*(-this.T)*dt); this.ice+=df; this.water-=df; this.T=Math.min(0,this.T+334*df/(Math.max(this.water,.5)*CW)); }
    this.Tmin=Math.min(this.Tmin,this.T); this.stir*=Math.exp(-1.5*dt);
    this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:this.T});} }
  layers(){ return [{v:this.water,c:[150,195,235,.38]}] }
  solids(){ return this.ice>.01?{frac:this.ice/Math.max(this.mi0,this.ice,.1),kind:"ice",col:[235,245,255]}:null }
  prompt(){ if(this.ice<=.01) return null; if(this.T<=.05) return this.Tbath!=null&&this.Tbath<0?"הקרח לא נמס. להפך, המים קופאים. למה?":"המים הגיעו ל-0°C והקרח שנותר לא נמס עוד"; return "נער כדי לזרז את ההמסה של הקרח"; }
  idle(){ return this.ice<=.01?"כל הקרח נמס. אפשר לעבור לשאלות.":"צפה במדחום." }
  graph(){ return {xl:"זמן (s)",yl:"טמפרטורה (°C)",series:[{name:"טמפרטורה",color:"cold",pts:this.hist}]} }
  readouts(){ return [["טמפרטורה",fx(this.T)+" °C"],["קרח שנותר",fx(this.ice,2)+" g"],["זמן",fx(this.t,0)+" s"]] }
  done(){ return this.t>10 }
  record(){ const melted=this.mi0-this.ice; const rows=[["מסת הקרח שהוכנס",fx(this.mi0,2)+" g"],["מסת המים",this.p.Vw+" g"],["טמפרטורת המים בהתחלה",fx(this.T0)+" °C"],["טמפרטורה בסוף",fx(this.T)+" °C"],["קרח שנמס",fx(Math.max(0,melted),2)+" g"]];
    if(this.Tbath!=null) rows.push(["אמבט",this.Tbath+" °C"]);
    return {kind:"ice",mi:this.mi0,ice:this.ice,melted:Math.max(0,melted),Vw:this.p.Vw,T0:this.T0,Tend:this.T,bath:this.Tbath,rows}; }
}
/* ערבוב עם שינוי צבע (כלור ויודיד, יוד ועמילן, בנדיקט) */
class ColorMixSim{
  constructor(p){ this.p=p; this.m=0; this.r=0; this.t=0; this.stir=0; this.settle=0; this.needHeat=!!p.needHeat; this.T=this.needHeat?25:null; this.Tbath=25; this.shakes=0; }
  get bath(){return this.needHeat?this.Tbath:undefined}
  shake(I){ this.shakes+=I; this.stir=Math.min(1,this.stir+.3*I); this.m=Math.min(1,this.m+(1-this.m)*.13*I); }
  step(dt){ this.t+=dt; this.m=Math.min(1,this.m+.0015*dt);
    if(this.needHeat){ this.T+=(this.Tbath-this.T)*(1-Math.exp(-.035*(1+1.5*this.stir)*dt)); if(this.p.reacts&&this.T>60) this.r=Math.min(this.m,this.r+.03*dt*(this.T-60)/20); }
    else this.r=this.p.reacts?this.m:0;
    this.stir*=Math.exp(-1.5*dt); this.settle=this.stir>.15?Math.max(0,this.settle-dt):Math.min(1,this.settle+.06*dt); }
  actions(){ return this.needHeat?[{id:"hot",label:"אמבט חם 80°C",on:this.Tbath===80},{id:"room",label:"אמבט 25°C",on:this.Tbath===25}]:[] }
  act(id){ if(id==="hot")this.Tbath=80; if(id==="room")this.Tbath=25; }
  layers(){ const A=this.p.A,B=this.p.B; const mid=mixC(mixC(A.c,B.c,.5),this.p.prodC,this.r); const L=[{v:A.v*(1-this.m),c:A.c},{v:(A.v+B.v)*this.m,c:mid},{v:B.v*(1-this.m),c:B.c}];
    if(this.p.hex) L.push({v:3,c:mixC([240,238,222,.35],this.p.hexProd,this.r)}); return L; }
  precip(){ return this.p.precipC&&this.r>.05?{amt:this.r,c:this.p.precipC,settle:this.settle}:null }
  solids(){return null}
  prompt(){ return this.m<.97?"נער כדי לערבב":null }
  idle(){ if(this.needHeat&&this.Tbath<60) return "בטמפרטורת החדר לא רואים שינוי. נסה אמבט חם."; return this.p.reacts?"צפה בשינוי הצבע.":"התמיסות מעורבבות. לא נראה שינוי צבע."; }
  graph(){return null}
  readouts(){ const r=[["ערבוב",fx(this.m*100,0)+"%"],["שינוי צבע",this.r>.5?"כן":this.r>.05?"מתחיל":"לא"]]; if(this.needHeat) r.unshift(["טמפרטורה",fx(this.T)+" °C"]); return r; }
  done(){ return this.m>.95 }
  record(){ return {kind:"colormix",p:this.p,r:this.r,rows:[["תמיסה א",this.p.A.n],["תמיסה ב",this.p.B.n],["תצפית",this.r>.5?this.p.obsYes:this.p.obsNo]]}; }
}
/* עכירות: תגובת השעון של תיוסולפט, ודנטורציה של חלבון */
class CloudSim{
  constructor(p){ this.p=p; this.c=p.c; this.Tbath=p.bath??25; this.T=this.Tbath; this.mode=p.mode||"thio"; this.m=this.mode==="thio"?0:1; this.turb=0; this.t=0; this.tStart=null; this.tCross=null; this.stir=0; this.cross=this.mode==="thio"; this.acid=false; this.heat=false; this.salt=false; this.hist=[{x:0,y:0}]; this._h=0; }
  get bath(){return this.mode==="thio"?this.Tbath:(this.heat?80:25)}
  shake(I){ this.stir=Math.min(1,this.stir+.3*I); this.m=Math.min(1,this.m+(1-this.m)*.2*I); }
  step(dt){ this.t+=dt; this.T+=(this.bath-this.T)*(1-Math.exp(-.03*(1+2*this.stir)*dt));
    if(this.mode==="thio"){ if(this.m>.9&&this.tStart==null) this.tStart=this.t;
      if(this.tStart!=null&&this.tCross==null){ const k=.011*(this.c/.1)*Math.pow(2,(this.T-25)/10); this.turb=Math.min(1,this.turb+k*dt); if(this.turb>=.6) this.tCross=this.t-this.tStart; }
      else if(this.tCross!=null) this.turb=Math.min(1,this.turb+.004*dt); }
    else { if(this.heat&&this.T>58) this.turb=Math.min(1,this.turb+.05*dt); if(this.acid) this.turb=Math.min(1,this.turb+.08*dt); }
    this.stir*=Math.exp(-1.5*dt); this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:+(this.turb*100).toFixed(1)});} }
  actions(){ if(this.mode==="thio") return []; return [{id:"heat",label:"אמבט חם 80°C",on:this.heat},{id:"acid",label:"הוסף חומצה",dis:this.acid},{id:"salt",label:"הוסף מעט מלח",dis:this.salt}]; }
  act(id){ if(id==="heat")this.heat=true; if(id==="acid")this.acid=true; if(id==="salt")this.salt=true; }
  layers(){ const base=this.mode==="thio"?[150,195,235,.30]:[250,245,215,.35]; const VA=this.p.VA,VB=this.p.VB||0;
    return [{v:VA*(1-this.m),c:base},{v:(VA+VB)*this.m,c:mixC(base,[248,248,240,.95],this.turb)},{v:VB*(1-this.m),c:[150,195,235,.30]}]; }
  solids(){return null}
  prompt(){ if(this.m<.9) return "נער כדי לערבב את החומצה עם התיוסולפט. השעון מתחיל כשהערבוב מלא"; if(this.mode!=="thio"&&(this.acid||this.heat||this.salt)&&this.stir<.1&&this.t<6) return "נער כדי לערבב"; return null; }
  idle(){ if(this.mode==="thio") return this.tCross==null?"עקוב: מתי הצלב שמתחת למבחנה נעלם?":`הצלב נעלם אחרי ${fx(this.tCross,1)} שניות.`; return this.heat||this.acid||this.salt?"צפה: האם התמיסה נעשית עכורה?":"בחר פעולה: חימום, חומצה או מלח."; }
  graph(){ return {xl:"זמן (s)",yl:"עכירות (%)",series:[{name:"עכירות",color:"accent",pts:this.hist}],ymin:0,ymax:100} }
  readouts(){ const r=[["טמפרטורה",fx(this.T)+" °C"],["עכירות",fx(this.turb*100,0)+"%"]]; if(this.mode==="thio") r.push(["זמן מהערבוב",this.tStart==null?"—":fx((this.tCross!=null?this.tCross:this.t-this.tStart),1)+" s"]); return r; }
  done(){ return this.mode==="thio"?this.tCross!=null:(this.turb>.3||this.t>30) }
  record(){ const rows=this.mode==="thio"?[["ריכוז Na₂S₂O₃",this.c+" M"],["טמפרטורה",this.Tbath+" °C"],["זמן עד היעלמות הצלב",this.tCross!=null?fx(this.tCross,1)+" s":"לא נעלם"]]:[["פעולות",[this.heat?"חימום ל-80°C":"",this.acid?"הוספת חומצה":"",this.salt?"הוספת מלח":""].filter(Boolean).join(", ")||"ללא"],["עכירות בסוף",fx(this.turb*100,0)+"%"]];
    return {kind:"cloud",c:this.c,bath:this.Tbath,tCross:this.tCross,heat:this.heat,acid:this.acid,salt:this.salt,turb:this.turb,hist:this.hist.slice(),rows}; }
}
/* גז במזרק סגור: חוק צ'ארלס ועבודה */
class GasExpandSim{
  constructor(p){ this.P=760; this.T=25; this.Tbath=25; this.V0=50; this.n=(this.V0/1000)/(RL*298); this.t=0; this.stir=0; this.hist=[{x:0,y:50}]; this._h=0; this.hasGas=true; this.stopper=true; this.log=[]; }
  get bath(){return this.Tbath}
  gasML(){ return this.n*RL*(this.T+273)*1000 }
  shake(I){ this.stir=Math.min(1,this.stir+.3*I) }
  step(dt){ this.t+=dt; this.T+=(this.Tbath-this.T)*(1-Math.exp(-.03*(1+2*this.stir)*dt)); this.stir*=Math.exp(-1.5*dt); this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:+this.gasML().toFixed(2)});} }
  actions(){ return [{id:"hot",label:"אמבט חם 70°C",on:this.Tbath===70},{id:"room",label:"אמבט 25°C",on:this.Tbath===25},{id:"ice",label:"אמבט קרח 0°C",on:this.Tbath===0}] }
  act(id){ this.Tbath={hot:70,room:25,ice:0}[id]; this.log.push(id); }
  layers(){ return [] }
  solids(){ return null }
  prompt(){ return Math.abs(this.T-this.Tbath)>2?"נער כדי שהגז יגיע מהר לטמפרטורת האמבט":null }
  idle(){ return "בחר אמבט וצפה בבוכנה של המזרק." }
  graph(){ return {xl:"זמן (s)",yl:"נפח הגז (mL)",series:[{name:"נפח",color:"accent",pts:this.hist}],ymin:40,ymax:65} }
  readouts(){ return [["נפח גז",fx(this.gasML())+" mL"],["טמפרטורה",fx(this.T)+" °C"],["לחץ (קבוע)","760 mmHg"]] }
  done(){ return this.log.length>=1&&this.t>10 }
  record(){ return {kind:"expand",V0:50,Vend:this.gasML(),Tend:this.T,Tb:this.Tbath,n:this.n,rows:[["נפח התחלתי ב-25°C","50.0 mL"],["לחץ (קבוע)","760 mmHg = 1 atm"],["טמפרטורה בסוף",fx(this.T)+" °C"],["נפח בסוף",fx(this.gasML())+" mL"]]}; }
}
/* מד pH: חומר במים עם אינדיקטור */
class PhMeterSim{

  step(dt){ this.t+=dt; this.m=Math.min(1,this.m+.002*dt); this.stir*=Math.exp(-1.5*dt); }
  layers(){ return [{v:12,c:mixC([150,195,235,.3],indColor(this.item.pH),this.m)}] }
  solids(){ return null }
  prompt(){ return this.m<.95?"נער כדי לערבב את החומר עם המים והאינדיקטור":null }
  idle(){ return "הצבע התייצב. קרא את ה-pH." }
  graph(){ return null }
  readouts(){ return [["pH",this.m>.95?fx(this.item.pH,1):"—"],["ערבוב",fx(this.m*100,0)+"%"]] }
  done(){ return this.m>.95 }
  record(){ const pH=this.item.pH; return {kind:"ph",item:this.item,sub:this.p.sub,rows:[["חומר",this.item.n],["pH נמדד",fx(pH,1)],["צבע האינדיקטור",pH<3?"אדום":pH<6?"כתום עד צהוב":pH<8?"ירוק":pH<11?"כחול":"סגול"]]}; }
}
/* טיטרציית חמצון-חיזור: פרמנגנט וברזל(II) */
class RedoxTitrSim{
  constructor(p){ this.p=p; this.c=p.c; this.n0=p.c*.010; this.nFe=0; this.Vmix=0; this.Vun=0; this.Vtot=0; this.t=0; this.stir=0; this.hist=[{x:0,y:100}]; this.pending=false; this.Veq=null; }
  rem(){ return Math.max(0,this.n0-this.nFe/5) }
  add(ml){ if(this.Vtot>=10)return; this.Vun+=ml; this.Vtot+=ml; this.pending=true; }
  shake(I){ this.stir=Math.min(1,this.stir+.3*I); if(this.Vun<=0)return; let mv=Math.min(this.Vun,this.Vun*.2*I+.1*I); if(this.Vun-mv<.02)mv=this.Vun; this.Vun-=mv; this.Vmix+=mv; this.nFe+=.1*mv/1000; }
  step(dt){ this.t+=dt; this.stir*=Math.exp(-1.5*dt); if(this.pending&&this.Vun<=0){this.pending=false; const pct=+(this.rem()/this.n0*100).toFixed(1); this.hist.push({x:this.Vtot,y:pct}); if(pct<=.5&&this.Veq==null) this.Veq=this.Vtot;} }
  actions(){ return [{id:"a1",label:"הוסף 1 mL FeSO₄ 0.1 M",dis:this.Vtot>=10||this.Vun>0}] }
  act(id){ if(id==="a1") this.add(1); }
  color(){ const f=this.rem()/this.n0; return mixC([235,210,120,.45],[110,20,130,.9],Math.pow(f,.6)); }
  layers(){ return [{v:10+this.Vmix,c:this.color()},{v:this.Vun,c:[180,225,190,.6]}] }
  solids(){ return null }
  prompt(){ return this.Vun>0?"נער כדי לערבב":null }
  idle(){ return this.rem()<=1e-9?"הצבע הסגול נעלם. אפשר להוסיף עוד כדי לוודא, או לעבור לשאלות.":"הוסף עוד 1 mL FeSO₄ ונער."; }
  graph(){ return {xl:"נפח FeSO₄ שהוסף (mL)",yl:"% MnO₄⁻ שנותר",series:[{name:"MnO₄⁻",color:"alt",pts:this.hist,dots:true}],ymin:0,ymax:100,xmin:0,xmax:10} }
  readouts(){ return [["FeSO₄ שהוסף",this.Vtot+" mL"],["צבע",this.rem()/this.n0>.5?"סגול":this.rem()>1e-9?"סגול חיוור":"צהבהב, לא סגול"]] }
  done(){ return this.Veq!=null }
  record(){ return {kind:"redox",c:this.c,n0:this.n0,Veq:this.Veq,Vtot:this.Vtot,rows:[["תמיסת KMnO₄ מחומצת","10 mL, "+this.c+" M"],["תמיסת FeSO₄","0.1 M"],["נפח שבו הצבע הסגול נעלם",this.Veq!=null?this.Veq+" mL":"עדיין סגול"]]}; }
}
/* חזרות על מדידה: ממוצע וסטיית תקן */
class RepeatSim{
  constructor(p){ this.hom=0; this.vals=[]; this.t=0; this.stir=0; this.tru=.620; this.flags=[]; }
  shake(I){ this.stir=Math.min(1,this.stir+.3*I); this.hom=Math.min(1,this.hom+.12*I); }
  step(dt){ this.t+=dt; this.stir*=Math.exp(-1.5*dt); this.hom*=Math.exp(-.02*dt); }
  actions(){ return [{id:"meas",label:"מדוד בליעה",dis:this.vals.length>=5,primary:true}] }
  act(id){ if(id==="meas"&&this.vals.length<5){ const bad=this.hom<.5; this.vals.push(+(this.tru+gauss()*.008+(bad?.14:0)).toFixed(3)); this.flags.push(bad); } }
  layers(){ return [{v:12,c:mixC([60,120,215,.55],[30,95,210,.85],this.hom)}] }
  solids(){ return null }
  prompt(){ return this.hom<.5&&this.vals.length<5?"נער כדי שהתמיסה תהיה אחידה לפני המדידה":null }
  idle(){ return this.vals.length>=5?"יש חמש מדידות. אפשר לעבור לשאלות.":"התמיסה אחידה. לחץ \"מדוד בליעה\"."; }
  graph(){ return {xl:"מספר המדידה",yl:"בליעה A",series:[{name:"מדידות",color:"accent",pts:this.vals.map((v,i)=>({x:i+1,y:v})),dots:true,noline:true}],xmin:0,xmax:6,ymin:.5,ymax:.9} }
  readouts(){ return [["מדידות",this.vals.length+" / 5"],["אחידות התמיסה",fx(this.hom*100,0)+"%"]] }
  done(){ return this.vals.length>=5 }
  record(){ const v=this.vals; const mean=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(v.length-1)); const bad=this.flags.findIndex(x=>x);
    return {kind:"repeat",vals:v.slice(),mean,sd,bad,rows:v.map((x,i)=>["מדידה "+(i+1),"A = "+x])}; }
}
/* שיווי משקל NO₂ / N₂O₄ בכלי סגור */
class NO2Sim{
  constructor(){ this.T=25; this.Tbath=25; this.t=0; this.stir=0; this.x=this.xeq(); this.hist=[{x:0,y:this.T}]; this.xh=[{x:0,y:this.x*100}]; this._h=0; this.log=[]; this.stopper=true; }
  xeq(){ const Tk=this.T+273; const K=200*Math.exp(-57200/8.314*(1/298-1/Tk)); const ct=.04; let lo=0,hi=1; for(let i=0;i<60;i++){const m=(lo+hi)/2; const q=((1-m)*ct/2)/((m*ct)**2); if(q>K)lo=m; else hi=m;} return (lo+hi)/2; }
  shake(I){ this.stir=Math.min(1,this.stir+.3*I) }
  step(dt){ this.t+=dt; this.T+=(this.Tbath-this.T)*(1-Math.exp(-.035*(1+1.5*this.stir)*dt)); this.x+=(this.xeq()-this.x)*(1-Math.exp(-.3*dt)); this.stir*=Math.exp(-1.5*dt);
    this._h+=dt; if(this._h>=.5){this._h=0; this.hist.push({x:this.t,y:this.T}); this.xh.push({x:this.t,y:+(this.x*100).toFixed(1)});} }
  actions(){ return [{id:"hot",label:"אמבט חם 70°C",on:this.Tbath===70},{id:"room",label:"אמבט 25°C",on:this.Tbath===25},{id:"ice",label:"אמבט קרח 0°C",on:this.Tbath===0}] }
  act(id){ this.Tbath={hot:70,room:25,ice:0}[id]; this.log.push(id); }
  get bath(){return this.Tbath}
  layers(){ return [{v:36,c:mixC([245,240,225,.12],[150,70,20,.85],Math.pow(this.x,.8))}] }
  solids(){ return null }
  colorName(){ return this.x>.5?"חום כהה":this.x>.25?"חום":"כמעט שקוף" }
  prompt(){ return Math.abs(this.T-this.Tbath)>3?"נער כדי שהגז יגיע מהר לטמפרטורת האמבט":null }
  idle(){ return "בחר אמבט וצפה בצבע הגז." }
  graph(){ return {xl:"זמן (s)",yl:"% NO₂ / טמפרטורה",series:[{name:"% NO₂ (חום)",color:"hot",pts:this.xh},{name:"טמפרטורה (°C)",color:"muted",pts:this.hist}],ymin:0,ymax:100} }
  readouts(){ return [["טמפרטורה",fx(this.T)+" °C"],["צבע",this.colorName()],["% NO₂",fx(this.x*100,0)+"%"]] }
  done(){ return this.log.length>=2 }
  record(){ return {kind:"no2",log:this.log.slice(),rows:[["פעולות",this.log.length+""],["צבע בסוף",this.colorName()],["טמפרטורה בסוף",fx(this.T)+" °C"]]}; }
}

/* ============ קלט ניעור ============ */
const Shake={mode:"button",vis:0,count:0,last:0,prev:null,motionTried:false,energy:0,listening:false};
function isTouch(){return matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0}
async function enableMotion(){
  if(typeof DeviceMotionEvent==="undefined") return false;
  try{ if(typeof DeviceMotionEvent.requestPermission==="function"){ const r=await DeviceMotionEvent.requestPermission(); if(r!=="granted") return false; } }catch(e){return false}
  return await new Promise(res=>{ let ok=false; const h=e=>{const a=e.accelerationIncludingGravity||e.acceleration; if(a&&a.x!=null&&(a.x!==0||a.y!==0||a.z!==0)){ok=true;}};
    window.addEventListener("devicemotion",h); setTimeout(()=>{window.removeEventListener("devicemotion",h); res(ok)},1600); });
}
function onMotion(e){ const a=e.accelerationIncludingGravity; if(!a||a.x==null)return;
  if(Shake.prev){ const d=Math.abs(a.x-Shake.prev.x)+Math.abs(a.y-Shake.prev.y)+Math.abs(a.z-Shake.prev.z); const now=performance.now();
    if(d>14&&now-Shake.last>120){ Shake.last=now; fireShake(clamp(d/28,.5,1.6)); } }
  Shake.prev={x:a.x,y:a.y,z:a.z}; }
async function setupShake(){
  if(Shake.motionTried) return; Shake.motionTried=true;
  if(!isTouch()){Shake.mode="button";return}
  const ok=await enableMotion();
  if(ok){Shake.mode="motion"; if(!Shake.listening){window.addEventListener("devicemotion",onMotion); Shake.listening=true;}} else {Shake.mode="blocked";}
}
function fireShake(I){ if(APP.phase!=="run"||!APP.sim)return; APP.sim.shake(I); Shake.vis=1; Shake.count++; Shake.energy=Math.min(1,Shake.energy+.12);
  if(Shake.mode==="motion"&&navigator.vibrate&&Shake.count%12===0){try{navigator.vibrate(15)}catch(e){}} }

/* ============ מצב האפליקציה ============ */
const APP={view:"home",exp:null,phase:"setup",params:{},sim:null,pred:null,rec:null,runs:[],answers:{},speed:3,env:null};

function renderHome(){

/* ============ מסך ניסוי ============ */
function unitOf(id){return UNITS.find(u=>u.exps.includes(id))}
function openExp(id){
  const e=EXPS[id]; APP.exp=id; APP.phase="setup"; APP.pred=null; APP.rec=null; APP.answers={}; APP.runs=[]; APP.params={};
  (e.setup||[]).forEach(c=>APP.params[c.id]=c.def);
  APP.env={T:R3(),P:P3()};
  try{history.replaceState(null,"","#"+id)}catch(err){}
  buildSim(); renderExp();
}
function buildSim(){ const e=EXPS[APP.exp]; APP.sim=e.make({...APP.params,_T:APP.env.T,_P:APP.env.P}); }
function renderExp(){
  const e=EXPS[APP.exp], u=unitOf(APP.exp); const v=$("#view");
  const tagsHtml=[u.tag!==e.tag?SCREENS_TAG_LABEL(u.tag):"",SCREENS_TAG_LABEL(e.tag)].join("");
  const steps=["הכנה","ניבוי","ניסוי","שאלות"], idx={setup:0,predict:1,run:2,questions:3}[APP.phase];
  v.innerHTML=`<nav class="crumbs"><button class="back" id="backBtn">→ חזרה ליחידות</button></nav>
   <header class="exphead"><div class="tags">${tagsHtml}</div><h1>${e.title}</h1><p class="lede">${e.lede}</p>
    ${e.eqn?`<p>${F(e.eqn)}</p>`:""}
    ${e.tag==="off"?OFFNOTE:""}
    <details class="curr"><summary>קשר למיקוד תשפ"ז · ${u.title}</summary><ul>${e.curr.map(c=>`<li>${c}</li>`).join("")}</ul></details></header>

function qHtml(q,i){

  if(q.t==="mcq"){ if(!q.order){const r=rnd(Date.now()%100000+i*977); q.order=q.opts.map((_,j)=>j); for(let k=q.order.length-1;k>0;k--){const m=Math.floor(r()*(k+1)); [q.order[k],q.order[m]]=[q.order[m],q.order[k]];}}

function bindQ(q,i){

      fb.innerHTML=bidiFix(ok?`<div class="fb ok"><b class="h">נכון.</b>${q.why}</div>`:`<div class="fb bad"><b class="h">לא בדיוק.</b>${(q.wrongWhy&&q.wrongWhy[j])||"נסה שוב. חשוב על הנתונים שמדדת."}</div>`);
      updateScore(); })); }

function near(v,t,q){ const tol=q.tol??.03; const abs=q.tolAbs??0; return Math.abs(v-t)<=Math.max(Math.abs(t)*tol,abs,1e-12); }
function checkNum(q,v,u){
  if(isNaN(v)) return {ok:false,msg:"לא זיהיתי מספר. כתוב רק את המספר, למשל 0.0025 או 2.5e-3."};
  const valOk=near(v,q.ans,q);
  if(valOk&&u!==q.unit) return {ok:false,msg:u==="בחר יחידה"?"הערך נכון, אבל חסרה יחידה. לפי המיקוד חובה לרשום יחידות בתשובה הסופית.":`הערך נכון, אבל היחידה לא מתאימה. הגודל הזה נמדד ב-${F(q.unit)}.`};
  if(valOk) return {ok:true,msg:q.why};
  for(const t of (q.traps||[])) if(near(v,t.v,{tol:.03})) return {ok:false,msg:t.msg};
  if(near(v,-q.ans,q)&&q.ans!==0) return {ok:false,msg:"הערך המוחלט נכון, אבל הסימן הפוך."};
  if(near(v,q.ans*1000,q)||near(v,q.ans/1000,q)) return {ok:false,msg:"התוצאה רחוקה פי 1000 מהתשובה. בדוק מעבר יחידות (mL ↔ L, J ↔ kJ, g ↔ mg)."};
  return {ok:false,msg:"התוצאה לא מתאימה לנתונים. בדוק את הנוסחה, את היחידות של כל נתון ואת סדר הפעולות."};
}

  c.font="600 11px 'IBM Plex Mono',monospace"; c.textAlign="center"; c.fillText(fx(ml)+" mL",x,top+len+28); if(ml>=99.5){c.fillStyle=COL.hot; c.fillText("מלא",x,top+len+42);} }
function drawBath(c,Tb,cx){ const x0=cx-54,x1=cx+54,y0=210,y1=392; const col=Tb>=60?[240,150,110,.28]:Tb<=5?[170,215,250,.4]:[150,195,235,.22];
  c.fillStyle=rgba(col); c.fillRect(x0,y0,x1-x0,y1-y0); c.strokeStyle=COL.glass; c.lineWidth=1.5; c.beginPath(); c.moveTo(x0,y0-30); c.lineTo(x0,y1); c.lineTo(x1,y1); c.lineTo(x1,y0-30); c.stroke();
  if(Tb<=5){ c.fillStyle="rgba(255,255,255,.75)"; [[-40,230],[30,250],[-30,300],[34,330],[-38,360]].forEach(([dx,yy])=>{c.save();c.translate(cx+dx,yy);c.rotate(.3);c.fillRect(-7,-7,14,14);c.restore()}); }
  if(Tb>=60){ c.strokeStyle=COL.hot; c.lineWidth=1.5; const t=performance.now()/600; for(let k=-1;k<=1;k+=2){ c.beginPath(); for(let yy=0;yy<26;yy++){c.lineTo(cx+k*44+Math.sin(yy/4+t)*3,y0-6-yy)} c.stroke(); } } }
function drawTube(dt){
  if(!ctx)return; const s=APP.sim; const e=EXPS[APP.exp]; ctx.clearRect(0,0,280,400);
  if(e.noTube){ drawBonds(); return; }
  const vis=Shake.vis, tnow=performance.now()/1000; const ox=Math.sin(tnow*38)*vis*6; const cx=TB.cx+ox;
  if(s.bath!=null) drawBath(ctx,s.bath,TB.cx);
  if(s.cross){ ctx.strokeStyle=COL.ink; ctx.lineWidth=5; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(cx-16,TB.bot-56); ctx.lineTo(cx+16,TB.bot-24); ctx.moveTo(cx+16,TB.bot-56); ctx.lineTo(cx-16,TB.bot-24); ctx.stroke(); ctx.lineCap="butt"; }
  if(s.insul){ ctx.fillStyle=COL.surface2; ctx.strokeStyle=COL.line; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(TB.cx-TB.w/2-14,TB.top+30,TB.w+28,TB.bot-TB.top-12,18); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.clip(); ctx.strokeStyle=COL.line; for(let y=TB.top+20;y<TB.bot+40;y+=9){ctx.beginPath();ctx.moveTo(TB.cx-60,y);ctx.lineTo(TB.cx+60,y-30);ctx.stroke()} ctx.restore();
    ctx.fillStyle=COL.muted; ctx.font="10px 'Assistant',sans-serif"; ctx.textAlign="center"; ctx.direction="rtl"; ctx.fillText("בידוד",TB.cx,TB.bot+24); ctx.direction="ltr"; }
  // נוזל
  ctx.save(); tubePath(ctx,cx); ctx.closePath(); ctx.clip();
  const layers=s.layers(); let cum=0; const tilt=Math.sin(tnow*24)*vis*.28;
  const totalV=layers.reduce((a,b)=>a+b.v,0); const surfY=TB.bot-totalV*TB.px;
  layers.forEach(L=>{ if(L.v<=.01)return; const y0=TB.bot-cum*TB.px, y1=TB.bot-(cum+L.v)*TB.px; cum+=L.v;
    ctx.fillStyle=rgba(L.c); ctx.beginPath(); const tl=(cum>=totalV-.001)?tilt:0;
    ctx.moveTo(cx-TB.w/2-2,y1-tl*TB.w/2); ctx.lineTo(cx+TB.w/2+2,y1+tl*TB.w/2); ctx.lineTo(cx+TB.w/2+2,y0+1); ctx.lineTo(cx-TB.w/2-2,y0+1); ctx.closePath(); ctx.fill();
    if(L.emul>.02){ ctx.fillStyle="rgba(232,190,60,.75)"; const n=Math.round(L.emul*45); for(let i=0;i<n;i++){const sd=SEEDS[i]; const yy=lerp(y0,y1,sd.y); ctx.beginPath(); ctx.arc(cx+sd.x*(TB.w/2-5),yy,1.5+sd.s*3,0,6.283); ctx.fill();} } });
  // משקע
  const pr=s.precip?s.precip():null;
  if(pr&&pr.amt>.01){ const liqH=totalV*TB.px; const n=Math.round(pr.amt*85*(1-pr.settle*.9)); ctx.fillStyle=rgba(pr.c,.9);
    for(let i=0;i<n;i++){const sd=SEEDS[i%90]; const yy=TB.bot-6-sd.y*(liqH-10)*(1-pr.settle)+Math.sin(tnow*3+i)*vis*6; ctx.fillRect(cx+sd.x*(TB.w/2-6),yy,2.2,2.2);}
    const th=pr.amt*pr.settle*16; if(th>.5){ctx.fillStyle=rgba(pr.c,.95); ctx.beginPath(); ctx.ellipse(cx,TB.bot-th/2,TB.w/2,th,0,0,6.283); ctx.fill();} }
  // מוצקים
  const so=s.solids?s.solids():null;
  if(so&&so.frac>.003){ const liqH=Math.max(20,totalV*TB.px); const lift=vis*(liqH-16)*.7;
    if(so.kind==="ice"){ const n=Math.max(1,Math.ceil(8*so.frac)); for(let i=0;i<n;i++){ const sd=SEEDS[i]; const sz=9+sd.s*5; const x=cx+sd.x*(TB.w/2-10); const y=surfY+3+sd.y*5-sz*.35+Math.sin(tnow*20+i)*vis*4;
        ctx.fillStyle="rgba(235,245,255,.85)"; ctx.strokeStyle="rgba(120,170,220,.9)"; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(x-sz/2,y-sz/2,sz,sz,2); ctx.fill(); ctx.stroke(); } }
    else if(so.kind==="ribbon"){ const h=Math.max(2,so.frac*70); ctx.fillStyle=rgba(so.col); ctx.save(); ctx.translate(cx+6,TB.bot-10-lift*.4); ctx.rotate(-.35+Math.sin(tnow*20)*vis*.4); ctx.fillRect(-2,-h,5,h); ctx.restore(); }
    else { const N=so.n||70; const n=Math.ceil(N*clamp(so.frac,0,1)); for(let i=0;i<n;i++){ const sd=SEEDS[i]; const big=so.kind==="crystal"||so.kind==="pellet"; const sz=big?4+sd.s*3:1.8+sd.s*1.6;
        const baseY=TB.bot-5-sd.z*(big?16:10)-(Math.abs(sd.x)>.6?(Math.abs(sd.x)-.6)*TB.r*1.2:0); const yy=baseY-lift*sd.y;
        ctx.fillStyle=rgba(so.col,1); ctx.strokeStyle="rgba(90,100,115,.55)"; ctx.lineWidth=.6; ctx.save(); ctx.translate(cx+sd.x*(TB.w/2-8)*.85,yy); ctx.rotate(sd.rot+tnow*vis*4);
        if(so.kind==="pellet"){ctx.beginPath();ctx.ellipse(0,0,sz*.9,sz*.6,0,0,6.283);ctx.fill();ctx.stroke()} else {ctx.fillRect(-sz/2,-sz/2,sz,sz); if(big)ctx.strokeRect(-sz/2,-sz/2,sz,sz);} ctx.restore(); } } }
  // משקע מתכת (תגובות החלפה)
  const dp=s.deposit?s.deposit():null;
  if(dp&&dp.frac>.01){ const n=Math.round(dp.frac*60); ctx.fillStyle=rgba(dp.c); for(let i=0;i<n;i++){const sd=SEEDS[(i*7)%90]; ctx.beginPath(); ctx.arc(cx+sd.x*(TB.w/2-9)*.8,TB.bot-6-sd.z*14,1.6+sd.s*1.5,0,6.283); ctx.fill();} }
  // מסמר
  const nl=s.nail?s.nail():null;
  if(nl){ ctx.fillStyle="#8b939d"; ctx.fillRect(cx-4,TB.top+24,8,TB.bot-TB.top-40); ctx.fillRect(cx-11,TB.top+18,22,7); ctx.beginPath(); ctx.moveTo(cx-4,TB.bot-16); ctx.lineTo(cx+4,TB.bot-16); ctx.lineTo(cx,TB.bot-6); ctx.fill();
    const n=Math.round(nl.rust*80); ctx.fillStyle="rgba(190,95,35,.9)"; for(let i=0;i<n;i++){const sd=SEEDS[i%90]; ctx.beginPath(); ctx.arc(cx+sd.x*4,TB.top+30+sd.y*(TB.bot-TB.top-50),1.2+sd.s*2.2,0,6.283); ctx.fill();} }
  // בועות
  const br=s.bubble?s.bubble():0;
  if(br>0){ const nnew=br*dt*45; let k=Math.floor(nnew)+(Math.random()<nnew%1?1:0); while(k-->0) bubbles.push({x:cx+(Math.random()*2-1)*(TB.w/2-10),y:TB.bot-8-Math.random()*10,r:1+Math.random()*2.4,v:40+Math.random()*50}); }
  ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=1;
  bubbles=bubbles.filter(b=>{b.y-=b.v*dt; b.x+=Math.sin(b.y/9)*.3; if(b.y<surfY+2)return false; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.stroke(); return true;});
  ctx.restore();
  // זכוכית
  ctx.strokeStyle=COL.glass; ctx.lineWidth=2.2; tubePath(ctx,cx); ctx.stroke();
  ctx.strokeStyle=COL.hi; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-TB.w/2+8,TB.top+12); ctx.lineTo(cx-TB.w/2+8,TB.bot-TB.r-4); ctx.stroke();
  ctx.strokeStyle=COL.glass; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(cx-TB.w/2-5,TB.top); ctx.lineTo(cx+TB.w/2+5,TB.top); ctx.stroke();
  if(s.stopper||s.hasGas){ ctx.fillStyle=COL.ink; ctx.globalAlpha=.8; ctx.beginPath(); ctx.roundRect(cx-TB.w/2+2,TB.top-16,TB.w-4,20,4); ctx.fill(); ctx.globalAlpha=1; }
  // סימון נפח
  ctx.fillStyle=COL.muted; ctx.font="9px 'IBM Plex Mono',monospace"; ctx.textAlign="left"; ctx.textBaseline="middle";
  for(let m=5;m<=30;m+=5){const yy=TB.bot-m*TB.px; ctx.fillRect(cx+TB.w/2-8,yy,8,1); ctx.fillText(m+"",cx+TB.w/2+3,yy);}
  if(s.hasGas) drawSyringe(ctx,s.gasML(),cx);
  if(s.lamp!=null){ const on=s.lamp>.05; ctx.strokeStyle=COL.muted; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx-12,TB.bot-30); ctx.lineTo(cx-12,TB.top-30); ctx.lineTo(cx+12,TB.top-30); ctx.lineTo(cx+12,TB.bot-30); ctx.stroke();
    ctx.fillStyle=COL.muted; ctx.fillRect(cx-15,TB.bot-70,6,40); ctx.fillRect(cx+9,TB.bot-70,6,40);
    ctx.strokeStyle=COL.muted; ctx.beginPath(); ctx.moveTo(cx,TB.top-30); ctx.lineTo(cx,TB.top-44); ctx.stroke();
    ctx.fillStyle=on?"#ffd23a":COL.surface2; ctx.strokeStyle=on?"#d9a400":COL.line; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,TB.top-54,11,0,6.283); ctx.fill(); ctx.stroke();
    if(on){ ctx.strokeStyle="rgba(255,210,58,.7)"; for(let k=0;k<6;k++){const a=k*Math.PI/3; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*15,TB.top-54+Math.sin(a)*15); ctx.lineTo(cx+Math.cos(a)*21,TB.top-54+Math.sin(a)*21); ctx.stroke();} } }
  if(s.T!=null) drawThermo(ctx,s.T);
}
function drawBonds(){ const c=ctx; c.fillStyle=COL.ink; c.font="600 15px 'IBM Plex Mono',monospace"; c.textAlign="center"; c.textBaseline="middle";
  const atom=(x,y,l,col)=>{c.fillStyle=col; c.beginPath(); c.arc(x,y,l==="H"?13:19,0,6.283); c.fill(); c.fillStyle="#fff"; c.fillText(l,x,y);};
  const bond=(x1,x2,y,lab)=>{c.strokeStyle=COL.ink; c.lineWidth=3; c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.stroke(); c.fillStyle=COL.muted; c.font="11px 'IBM Plex Mono',monospace"; c.fillText(lab,(x1+x2)/2,y-22); c.font="600 15px 'IBM Plex Mono',monospace";};
  bond(100,160,70,"436"); atom(100,70,"H","#5a6b80"); atom(160,70,"H","#5a6b80");
  bond(95,175,140,"243"); atom(95,140,"Cl","#2f8a4f"); atom(175,140,"Cl","#2f8a4f");
  c.fillStyle=COL.muted; c.font="22px sans-serif"; c.fillText("↓",135,200);
  [255,325].forEach(y=>{bond(100,170,y,"432"); atom(100,y,"H","#5a6b80"); atom(170,y,"Cl","#2f8a4f");});
  c.fillStyle=COL.muted; c.font="11px 'Assistant',sans-serif"; c.direction="rtl"; c.fillText("אנרגיות קשר ב-kJ/mol",140,385); c.direction="ltr"; }

/* ============ גרף ============ */
function drawGraph(){
  const card=$("#graphcard"); if(!card||!APP.sim)return; let g=APP.sim.graph?APP.sim.graph():null;
  if(g&&EXPS[APP.exp].runs&&APP.runs.length){ const pal=["muted","cold","alt","off","ok"]; g={...g,series:[...APP.runs.map((r,i)=>({name:r.label,color:pal[i%pal.length],pts:r.pts,faint:true})),...(APP.phase==="questions"?[]:[{...g.series[0],name:"ריצה נוכחית: "+runLabel()}])]}; }
  if(!g){card.hidden=true;return} card.hidden=false;
  $("#gtitle").textContent=g.yl; const lg=$("#glegend"); const lh=g.series.map(s=>`<span><i style="background:${tok("--"+s.color)}"></i>${s.name}</span>`).join(""); if(lg.innerHTML!==lh) lg.innerHTML=lh;
  const W=gcv.clientWidth, H=210; if(gcv.width!==W*DPR){gcv.width=W*DPR; gcv.height=H*DPR;} const c=gctx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  const all=g.series.flatMap(s=>s.pts); if(!all.length)return;
  let xmin=g.xmin??0, xmax=g.xmax??Math.max(10,...all.map(p=>p.x)); let ymin=g.ymin??Math.min(...all.map(p=>p.y)), ymax=g.ymax??Math.max(...all.map(p=>p.y));
  if(g.ymin==null){const pad=Math.max(1,(ymax-ymin)*.15); ymin=Math.floor(ymin-pad); ymax=Math.ceil(ymax+pad);} if(ymax-ymin<1e-6)ymax=ymin+1;
  const L=44,R=10,T=10,B=34; const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R), Y=y=>H-B-(y-ymin)/(ymax-ymin)*(H-T-B);
  c.strokeStyle=COL.line; c.lineWidth=1; c.fillStyle=COL.muted; c.font="10px 'IBM Plex Mono',monospace";
  const nice=(a,b,n)=>{const r=(b-a)/n; const p=10**Math.floor(Math.log10(r)); const st=[1,2,2.5,5,10].map(k=>k*p).find(k=>k>=r)||r; return st};
  const ys=nice(ymin,ymax,5); c.textAlign="right"; c.textBaseline="middle"; for(let y=Math.ceil(ymin/ys)*ys;y<=ymax+1e-9;y+=ys){c.beginPath();c.moveTo(L,Y(y));c.lineTo(W-R,Y(y));c.stroke(); c.fillText(String(+y.toFixed(3)),L-5,Y(y));}
  const xs=nice(xmin,xmax,6); c.textAlign="center"; c.textBaseline="top"; for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9;x+=xs){c.fillText(String(+x.toFixed(3)),X(x),H-B+5);}
  c.direction="rtl"; c.textAlign="center"; c.font="11px 'Assistant',sans-serif"; c.fillText(g.xl,L+(W-L-R)/2,H-14); c.direction="ltr";
  if(g.ymin===0&&g.ymax===14){c.setLineDash([3,3]); c.strokeStyle=COL.muted; c.beginPath(); c.moveTo(L,Y(7)); c.lineTo(W-R,Y(7)); c.stroke(); c.setLineDash([]);}
  g.series.forEach(s=>{ const col=tok("--"+s.color); c.strokeStyle=col; c.fillStyle=col; c.lineWidth=s.faint?1.5:2.2; c.globalAlpha=s.faint?.75:1; if(s.dash)c.setLineDash([5,4]);
    if(!s.noline&&s.pts.length>1){c.beginPath(); s.pts.forEach((p,i)=>{const px=X(clamp(p.x,xmin,xmax)),py=Y(clamp(p.y,ymin,ymax)); i?c.lineTo(px,py):c.moveTo(px,py)}); c.stroke();}
    c.setLineDash([]); if(s.dots) s.pts.forEach(p=>{c.beginPath(); c.arc(X(p.x),Y(p.y),3.5,0,6.283); c.fill();});
    else if(s.pts.length&&!s.faint&&!s.dash){const p=s.pts[s.pts.length-1]; c.beginPath(); c.arc(X(clamp(p.x,xmin,xmax)),Y(clamp(p.y,ymin,ymax)),3.5,0,6.283); c.fill();} c.globalAlpha=1; });
}

/* ============ לולאת אנימציה ============ */
let lastT=performance.now(), gAcc=0, uiAcc=0;
function loop(now){ const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(APP.view==="exp"&&APP.sim){ if(APP.phase==="run"){ const n=4, sd=dt*APP.speed/n; for(let i=0;i<n;i++) APP.sim.step(sd); }
    Shake.vis*=Math.exp(-dt*5); Shake.energy*=Math.exp(-dt*1.2); drawTube(dt);
    gAcc+=dt; if(gAcc>.25){gAcc=0; drawGraph(); renderReadouts(); const m=$("#smeter"); if(m)m.style.width=(Shake.energy*100)+"%"; if(APP.phase==="run"){updatePrompt(); if(APP.sim.actions)refreshActionsState();}} }
  requestAnimationFrame(loop); }
let lastActs="";
function refreshActionsState(){ const s=JSON.stringify(APP.sim.actions()); if(s!==lastActs){lastActs=s; renderActions();} }
requestAnimationFrame(loop);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
window.addEventListener("resize",()=>{ if(gcv) gcv.width=0; });

/* ============ פתיחה ============ */
(function init(){ const h=(location.hash||"").slice(1); if(h&&EXPS[h]) go("exp",h); else renderHome(); })();
